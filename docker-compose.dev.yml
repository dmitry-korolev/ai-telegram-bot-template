services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sleep infinity
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
      - path: .env.development
        required: false
    environment:
      NODE_ENV: development
      ENV_FILE: .env.development
      HEALTH_HOST: 0.0.0.0
    volumes:
      - .:/workspace
      - dev-node-modules:/workspace/node_modules
      - dev-data:/workspace/data

volumes:
  dev-node-modules:
  dev-data:
